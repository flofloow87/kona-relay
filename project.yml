name: KonaRelay
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    MARKETING_VERSION: "2.6"
    CURRENT_PROJECT_VERSION: "8"
targets:
  KonaRelay:
    type: application
    platform: iOS
    sources: [KonaRelayApp.swift, BLERelay.swift, KonaData.swift, Store.swift, Live.swift, Shared.swift, ContentView.swift, SettingsView.swift, HistoryViews.swift, Insights.swift, Batterie12View.swift, StartIntent.swift, Assets.xcassets]
    dependencies:
      - target: KonaWidget
    entitlements:
      path: KonaRelay.entitlements
      properties:
        com.apple.security.application-groups: [group.fr.flo.konarelay]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.flo.konarelay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Kona Relay
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes: [bluetooth-central, location]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSLocationWhenInUseUsageDescription: "Ajout de la position de la Kona aux données envoyées à Home Assistant."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Position de la Kona, tracé des trajets et lieu de stationnement, app en arrière-plan."
        NSBluetoothAlwaysUsageDescription: "Lecture des données de la Kona via l'ESP32."
        CFBundleURLTypes:
          - CFBundleURLName: fr.flo.konarelay
            CFBundleURLSchemes: [konarelay]
  KonaWidget:
    type: app-extension
    platform: iOS
    sources: [KonaWidget.swift, Shared.swift]
    entitlements:
      path: KonaWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.fr.flo.konarelay]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.flo.konarelay.widget
    info:
      path: KonaWidget-Info.plist
      properties:
        CFBundleDisplayName: Kona
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
