name: KonaRelay
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  KonaRelay:
    type: application
    platform: iOS
    sources: [KonaRelayApp.swift, BLERelay.swift, ContentView.swift, StartIntent.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.flo.konarelay
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Kona Relay
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes: [bluetooth-central, location]
        NSLocationWhenInUseUsageDescription: "Ajout de la position de la Kona aux données envoyées à Home Assistant."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Ajout de la position de la Kona aux données envoyées à Home Assistant, app en arrière-plan."
        NSBluetoothAlwaysUsageDescription: "Lecture des données de la Kona via l'ESP32."
